[package]
name = "wordcraft-agent-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft agent layer UI (fork): the Agent pane, badges and margin notes on the page, client-data marks, template client picker"

[lints]
workspace = true

[dependencies]
wordcraft-agent = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
wordcraft-mcp = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

# Voice questions (native only): microphone, local Whisper, pointing markers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-voice = { git = "https://github.com/anton-belkin/craft-voice", rev = "93f74521c8169c9578b8fd0b04a76d15dc6e2d02" }
